      - app-key

bazaar.abuse.ch:
  paths:
    allowlist:
      - /export/

# ── Generic auth-capable feed hosts (custom feeds added by users) ─────
# Any domain added via "Add Custom Feed" with header/queryparam auth will
# need its host added here. The allowlist below covers common SaaS CTI hosts.

feeds.recordedfuture.com:
  paths:
    allowlist:
      - /
  headers:
    allowlist:
      - x-rftoken
      - authorization

intelapi.emergingthreats.net:
  paths:
    allowlist:
      - /
  headers:
    allowlist:
      - authorization
      - x-api-key

api.crowdstrike.com:
  paths:
    allowlist:
      - /intel/
  headers:
    allowlist:
      - authorization

api.mimecast.com:
  paths:
    allowlist:
      - /api/
  headers:
    allowlist:
      - authorization
      - x-mc-req-id
      - x-mc-app-id
      - x-mc-date

api.intel471.com:
  paths:
    allowlist:
      - /v2/
  headers:
    allowlist:
      - authorization

