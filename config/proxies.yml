# ── Threat Feed sources ──────────────────────────────────────────────
# Auth headers allowlisted per-host so paid feeds can pass API keys through
# the Cribl service-worker proxy. Free feeds omit the headers block.

feodotracker.abuse.ch:
  paths:
    allowlist:
      - /downloads/

threatfox.abuse.ch:
  paths:
    allowlist:
      - /export/

urlhaus.abuse.ch:
  paths:
    allowlist:
      - /downloads/

www.spamhaus.org:
  paths:
    allowlist:
      - /drop/
      - /zen/
      - /dbl/
  headers:
    allowlist:
      - authorization
      - x-api-key

rules.emergingthreats.net:
  paths:
    allowlist:
      - /blockrules/
      - /open/
  headers:
    allowlist:
      - authorization
      - x-api-key

www.cisa.gov:
